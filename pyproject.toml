[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saudi-job-market-analyzer"
version = "0.1.0"
description = "Job-posting analytics for IT, data and AI roles: bilingual skill extraction, salary parsing, skills-gap tool. Demo data is synthetic."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aymen Al Erwi" }]
dependencies = ["numpy>=1.26", "pandas>=2.0", "matplotlib>=3.8", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
saudi-jobs = "saudi_jobs.cli:main"

[tool.setuptools.packages.find]
include = ["saudi_jobs*"]

[tool.setuptools.package-data]
saudi_jobs = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
